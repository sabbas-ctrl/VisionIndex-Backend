name: Build & Push Backend

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: server_address
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sabbas30/visionindex-frontend:backend
          build-args: |
            PORT=${{ secrets.PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}

            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            MONGO_URI=${{ secrets.MONGO_URI }}

            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}

            S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}
            S3_REGION=${{ secrets.S3_REGION }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_CHUNK_SIZE=${{ secrets.S3_CHUNK_SIZE }}  # (optional) 10 MB
            S3_PRESIGNED_URL_EXPIRY=${{ secrets.S3_PRESIGNED_URL_EXPIRY }}   # (optional) 1 hour
            CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}

            TEMPORAL_HOST=${{ secrets.TEMPORAL_HOST }}
            WORKER_CALLBACK_TOKEN=${{ secrets.WORKER_CALLBACK_TOKEN }}
            BACKEND_INTERNAL_URL=${{ secrets.BACKEND_INTERNAL_URL }}

            QUERY_SERVICE_URL=${{ secrets.QUERY_SERVICE_URL }}
            QDRANT_URL=${{ secrets.QDRANT_URL }}